spring.application.name=intelligent-qa
server.port=8082

app.assistant.runtime.model-id=gpt-4.1
app.assistant.runtime.api-base-url=https://api.openai.com/v1
app.assistant.runtime.timeout-ms=30000
app.assistant.runtime.embedding-model-name=text-embedding-3-large
app.assistant.runtime.embedding-dimension=3072
app.assistant.runtime.keyword-top-k=10
app.assistant.runtime.semantic-top-k=8
app.assistant.runtime.hybrid-weight=0.60
app.assistant.runtime.rerank-enabled=true
app.assistant.runtime.rerank-top-n=10
app.assistant.runtime.similarity-threshold=0.72
app.assistant.runtime.min-recall-count=4
app.assistant.runtime.system-template=你是 JavaKQA 的问答助手，请优先给出结构清晰、引用明确的回答。
app.assistant.runtime.query-rewrite-enabled=true
app.assistant.runtime.context-window-size=6
app.assistant.runtime.answer-max-length=1200
app.assistant.runtime.reference-enabled=true
app.assistant.runtime.knowledge-upload-enabled=true
app.assistant.runtime.feedback-enabled=true
app.assistant.runtime.analytics-enabled=true
app.assistant.runtime.sensitive-filter-enabled=false