<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>管理员账号</title>
	<link rel="stylesheet" th:href="@{/css/app.css(v='20260520c')}">
</head>
<body>
<div class="layout">
	<aside class="sidebar">
		<div>
			<div class="brand-kicker">JavaKQA</div>
			<h1>system-config</h1>
			<p>用于管理管理员账号、角色和状态，支撑系统配置模块的后台访问控制。</p>
		</div>
		<nav class="menu">
			<a th:href="@{/configs}">配置管理</a>
			<a class="active" th:href="@{/users}">管理员账号</a>
			<a th:href="@{/logs}">操作日志</a>
		</nav>
		<form th:action="@{/logout}" method="post">
			<button type="submit">退出登录</button>
		</form>
	</aside>

	<main class="content">
		<header class="page-header">
			<div>
				<h2>管理员账号</h2>
				<p>这里对应开发文档中的 sys_user 表，可新增管理员账号并切换启停状态。</p>
			</div>
			<div class="user-badge" th:if="${currentUser != null}">
				<div th:text="'当前登录：' + ${currentUser.username}"></div>
				<div th:text="'角色：' + ${currentUser.roleCode}"></div>
			</div>
		</header>

		<div class="message" th:if="${message}" th:text="${message}"></div>
		<div class="error-message" th:if="${errorMessage}" th:text="${errorMessage}"></div>

		<section class="panel">
			<h3>新增管理员</h3>
			<p>默认管理员账号会在系统首次启动时自动创建，你也可以继续在这里新增其他后台账号。</p>
			<div class="error-message" th:if="${formError}" th:text="${formError}"></div>
			<form th:action="@{/users}" th:object="${userForm}" method="post">
				<div class="form-grid">
					<div>
						<label for="username">用户名</label>
						<input id="username" type="text" th:field="*{username}" placeholder="例如 ops_admin">
					</div>
					<div>
						<label for="password">密码</label>
						<input id="password" type="password" th:field="*{password}" placeholder="请输入初始密码">
					</div>
					<div>
						<label for="roleCode">角色编码</label>
						<input id="roleCode" type="text" th:field="*{roleCode}" placeholder="例如 CONFIG_ADMIN">
					</div>
					<div>
						<label for="status">状态</label>
						<select id="status" th:field="*{status}">
							<option value="1">启用</option>
							<option value="0">停用</option>
						</select>
					</div>
				</div>
				<div class="actions">
					<button class="primary-btn" type="submit">创建管理员</button>
				</div>
			</form>
		</section>

		<section class="table-panel">
			<h3>账号列表</h3>
			<p>查看当前管理员账号、最近登录时间和启停状态。</p>
			<div class="table-wrapper">
				<table>
					<thead>
					<tr>
						<th>用户名</th>
						<th>角色编码</th>
						<th>状态</th>
						<th>最近登录时间</th>
						<th>创建时间</th>
						<th>操作</th>
					</tr>
					</thead>
					<tbody>
					<tr th:each="user : ${users}">
						<td th:text="${user.username}"></td>
						<td><span class="tag" th:text="${user.roleCode}"></span></td>
						<td>
							<span th:class="${user.active} ? 'status-chip enabled' : 'status-chip disabled'"
							      th:text="${user.active} ? '启用' : '停用'"></span>
						</td>
						<td th:text="${user.lastLoginTime != null} ? ${#temporals.format(user.lastLoginTime, 'yyyy-MM-dd HH:mm:ss')} : '未登录'"></td>
						<td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
						<td>
							<form th:action="@{/users/{id}/status(id=${user.id})}" method="post">
								<input type="hidden" name="status" th:value="${user.active} ? 0 : 1">
								<button th:class="${user.active} ? 'warning-btn' : 'secondary-btn'" type="submit"
								        th:text="${user.active} ? '停用账号' : '启用账号'"></button>
							</form>
						</td>
					</tr>
					</tbody>
				</table>
			</div>
		</section>
	</main>
</div>
</body>
</html>
